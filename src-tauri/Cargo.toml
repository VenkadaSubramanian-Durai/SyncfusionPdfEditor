[package]
name = "syncfusion-pdf-editor"
version = "0.1.0"
description = "Free PDF Editor sample built on Syncfusion PDF Viewer"
edition = "2021"
rust-version = "1.85"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (Tauri convention).
name = "syncfusion_pdf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
# Local plugin: native print screen on macOS, iOS and Android (see plugins/native-print).
tauri-plugin-native-print = { path = "plugins/native-print" }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
