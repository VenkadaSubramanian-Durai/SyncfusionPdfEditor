[package]
name = "cross-platform-pdf-editor"
version = "1.0.0"
description = "Edit, sign and compare PDFs. Free, and on your device."
edition = "2021"
rust-version = "1.85"

[lib]
name = "cross_platform_pdf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Only macOS needs the native print panel. Every other platform prints
# through the WebView of the shell.
[target.'cfg(target_os = "macos")'.dependencies]
native-print = { path = "plugins/native-print" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
